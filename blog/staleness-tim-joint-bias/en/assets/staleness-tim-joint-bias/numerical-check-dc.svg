<line x1="445" y1="265.71" x2="450" y2="265.71" class="axis"/>
<text x="440" y="269.71" text-anchor="end" class="label tick-label">1e−5</text>
<line x1="445" y1="191.43" x2="450" y2="191.43" class="axis"/>
<text x="440" y="195.43" text-anchor="end" class="label tick-label">1e−3</text>
<line x1="445" y1="117.14" x2="450" y2="117.14" class="axis"/>
<text x="440" y="121.14" text-anchor="end" class="label tick-label">1e−1</text>
<line x1="445" y1="80.00" x2="450" y2="80.00" class="axis"/>
<text x="440" y="84.00" text-anchor="end" class="label tick-label">1e0</text>
<text x="595.0" y="58" text-anchor="middle" class="label panel-title">Covariance C</text>
<text x="595.0" y="386" text-anchor="middle" class="label axis-label">perturbation scale σ (log)</text>
