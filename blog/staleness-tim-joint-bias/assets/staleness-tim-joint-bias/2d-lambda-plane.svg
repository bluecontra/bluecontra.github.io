<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 4 620 550" width="620" height="550" role="img" aria-labelledby="title desc">
  <title id="title">2D interpolation plane for staleness and TIM</title>
  <desc id="desc">Unit square with staleness lambda_S on the horizontal axis and TIM lambda_T on the vertical axis; four endpoints A, B, C, D at the corners.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <linearGradient id="stGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#fecaca"/>
      <stop offset="80%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc143c"/>
    </linearGradient>
    <style>
      .axis { stroke: #4b5563; stroke-width: 1.8; }
      .grid { stroke: #1f2937; stroke-opacity: 0.10; stroke-width: 1; }
      .square { stroke: #94a3b8; stroke-width: 1.4; }
      .point { stroke: #ffffff; stroke-width: 2.5; }
      .label { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Times New Roman", Georgia, serif; fill: #111827; }
      .axis-label { font-size: 19px; font-weight: 600; fill: #374151; }
      .tick { font-size: 14px; fill: #4b5563; }
      .point-label { font-size: 16px; font-weight: 700; }
      .desc { font-size: 13.5px; fill: #6b7280; }
      .int-title { font-size: 15px; font-weight: 700; fill: #3730a3; }
      .int-formula { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Times New Roman", Georgia, serif; font-size: 14.5px; fill: #4338ca; }
      .math-var { font-style: italic; }
      .math-op { font-style: normal; }
      .math-sym { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Times New Roman", Georgia, serif; font-style: italic; }
      .int-note { font-size: 12px; fill: #6366f1; }
    </style>
  </defs>

  <rect width="760" height="600" fill="#ffffff"/>

  <!-- unit square -->
  <rect x="170" y="90" width="440" height="380" rx="2" fill="url(#stGrad)" class="square"/>

  <!-- light grid -->
  <g class="grid">
    <line x1="280" y1="90" x2="280" y2="470"/>
    <line x1="390" y1="90" x2="390" y2="470"/>
    <line x1="500" y1="90" x2="500" y2="470"/>
    <line x1="170" y1="185" x2="610" y2="185"/>
    <line x1="170" y1="280" x2="610" y2="280"/>
    <line x1="170" y1="375" x2="610" y2="375"/>
  </g>

  <!-- interaction annotation -->
  <rect x="295" y="228" width="190" height="104" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="390" y="252" text-anchor="middle" class="label int-title">interaction</text>
  <text x="390" y="276" text-anchor="middle" class="label int-formula"><tspan class="math-op">= </tspan><tspan class="math-var">J</tspan><tspan class="math-op">(</tspan><tspan class="math-var">D</tspan><tspan class="math-op">) − </tspan><tspan class="math-var">J</tspan><tspan class="math-op">(</tspan><tspan class="math-var">B</tspan><tspan class="math-op">)</tspan></text>
  <text x="390" y="296" text-anchor="middle" class="label int-formula"><tspan class="math-op">− </tspan><tspan class="math-var">J</tspan><tspan class="math-op">(</tspan><tspan class="math-var">C</tspan><tspan class="math-op">) + </tspan><tspan class="math-var">J</tspan><tspan class="math-op">(</tspan><tspan class="math-var">A</tspan><tspan class="math-op">)</tspan></text>
  <text x="390" y="318" text-anchor="middle" class="label int-note">difference-in-differences</text>

  <!-- axes -->
  <line x1="170" y1="470" x2="680" y2="470" class="axis" marker-end="url(#arrow)"/>
  <line x1="170" y1="470" x2="170" y2="40" class="axis" marker-end="url(#arrow)"/>

  <!-- ticks -->
  <line x1="170" y1="470" x2="170" y2="477" class="axis"/>
  <line x1="610" y1="470" x2="610" y2="477" class="axis"/>
  <line x1="163" y1="90" x2="170" y2="90" class="axis"/>
  <line x1="163" y1="470" x2="170" y2="470" class="axis"/>

  <!-- axis labels -->
  <text x="690" y="462" class="label axis-label"><tspan class="math-sym">λ</tspan><tspan baseline-shift="sub" font-size="11" class="math-sym">S</tspan></text>
  <text x="690" y="482" class="label desc">staleness</text>
  <text x="186" y="30" class="label axis-label"><tspan class="math-sym">λ</tspan><tspan baseline-shift="sub" font-size="11" class="math-sym">T</tspan> (TIM)</text>

  <!-- tick labels -->
  <text x="170" y="498" text-anchor="middle" class="label tick">0</text>
  <text x="610" y="498" text-anchor="middle" class="label tick">1</text>
  <text x="152" y="95" text-anchor="end" class="label tick">1</text>
  <text x="152" y="475" text-anchor="end" class="label tick">0</text>

  <!-- points -->
  <circle cx="170" cy="470" r="7" class="point" fill="#6b7280"/>
  <circle cx="610" cy="470" r="7" class="point" fill="#2563eb"/>
  <circle cx="170" cy="90" r="7" class="point" fill="#7c3aed"/>
  <circle cx="610" cy="90" r="7" class="point" fill="#ef4444"/>

  <!-- A: clean current -->
  <text x="182" y="516" class="label point-label" fill="#374151">A <tspan class="desc" font-weight="400">· clean current</tspan></text>
  <text x="182" y="536" class="label desc"><tspan class="math-sym">π</tspan><tspan baseline-shift="sub" font-size="11" class="math-sym">θ</tspan> · (0,0)</text>

  <!-- B: staleness only -->
  <text x="598" y="516" text-anchor="end" class="label point-label" fill="#1d4ed8">B <tspan class="desc" font-weight="400">· staleness only</tspan></text>
  <text x="598" y="536" text-anchor="end" class="label desc"><tspan class="math-sym">π</tspan><tspan baseline-shift="sub" font-size="11" class="math-sym">θ−Δ</tspan> · (1,0)</text>

  <!-- C: TIM only -->
  <text x="182" y="112" class="label point-label" fill="#7c3aed">C <tspan class="desc" font-weight="400">· TIM only</tspan></text>
  <text x="182" y="130" class="label desc"><tspan class="math-sym">π̃</tspan><tspan baseline-shift="sub" font-size="11" class="math-sym">θ</tspan> · (0,1)</text>

  <!-- D: both -->
  <text x="598" y="112" text-anchor="end" class="label point-label" style="fill:#ffffff">D <tspan class="desc" font-weight="400" style="fill:#ffffff">· both</tspan></text>
  <text x="598" y="130" text-anchor="end" class="label desc" style="fill:#ffffff"><tspan class="math-sym">μ</tspan> · actual sampler · (1,1)</text>
</svg>
