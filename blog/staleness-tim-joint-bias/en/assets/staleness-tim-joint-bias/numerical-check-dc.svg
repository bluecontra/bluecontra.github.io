<line x1="75" y1="340.00" x2="80" y2="340.00" class="axis"/>
<text x="70" y="344.00" text-anchor="end" class="label tick-label">1e−7</text>
<line x1="75" y1="265.71" x2="80" y2="265.71" class="axis"/>
<text x="70" y="269.71" text-anchor="end" class="label tick-label">1e−5</text>
<line x1="75" y1="191.43" x2="80" y2="191.43" class="axis"/>
<text x="70" y="195.43" text-anchor="end" class="label tick-label">1e−3</text>
