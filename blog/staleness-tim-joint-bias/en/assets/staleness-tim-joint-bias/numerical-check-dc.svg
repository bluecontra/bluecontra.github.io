<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-labelledby="title desc">
  <title id="title">D-C view of the sanity check: relative error vs perturbation scale</title>
  <desc id="desc">Two log-log panels. Left: drift D; right: covariance C. First- and second-order relative errors at perturbation scales 1e-3, 1e-2, 1e-1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .axis { stroke: #4b5563; stroke-width: 1.5; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .ref { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 4; }
      .label { font-family: "Times New Roman", Georgia, serif; fill: #374151; }
      .panel-title { font-size: 17px; font-weight: 700; fill: #111827; }
      .axis-label { font-size: 13px; fill: #374151; }
      .tick-label { font-size: 12px; fill: #6b7280; }
      .legend { font-size: 12px; fill: #374151; }
      .ref-label { font-size: 11px; fill: #6b7280; }
      .first { stroke: #ea580c; stroke-width: 2.0; fill: none; stroke-dasharray: 5 4; }
      .second { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .point-first { fill: #ea580c; stroke: #ffffff; stroke-width: 1.5; }
      .point-second { fill: #2563eb; stroke: #ffffff; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="780" height="440" fill="#ffffff"/>

  <line x1="80" y1="154.29" x2="740" y2="154.29" class="ref"/>
  <text x="744" y="150.29" text-anchor="end" class="label ref-label">1%</text>

  <line x1="250" y1="32" x2="280" y2="32" class="first"/>
  <circle cx="265" cy="32" r="4" class="point-first"/>
  <text x="288" y="36" class="label legend">first-order</text>
  <line x1="390" y1="32" x2="420" y2="32" class="second"/>
  <circle cx="405" cy="32" r="4" class="point-second"/>
  <text x="428" y="36" class="label legend">second-order</text>

  <text x="24" y="210" transform="rotate(-90 24 210)" text-anchor="middle" class="label axis-label">relative error (log)</text>

<line x1="80.00" y1="80" x2="80.00" y2="340" class="grid"/>
<line x1="225.00" y1="80" x2="225.00" y2="340" class="grid"/>
